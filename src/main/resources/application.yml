spring:
  application:
    name: sourcing-pipeline
  datasource:
    url: jdbc:h2:file:./data/sourcing;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      # 스키마의 출처는 Flyway 마이그레이션이고, JPA 는 그 스키마가 매핑과 맞는지 확인만 한다.
      # update 로 두면 운영에서 아무도 의도하지 않은 DDL 이 조용히 실행된다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    # H2 와 PostgreSQL 은 타입이 미묘하게 달라(길이 없는 varchar 등) 벤더별로 나눠 둔다.
    locations: classpath:db/migration/{vendor}
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

collector:
  # 워커(크롬 확장 탭)가 동시에 점유할 수 있는 최대 작업 수
  max-concurrent-jobs: 3
  # 작업 클레임 후 이 시간 안에 결과가 없으면 죽은 워커로 보고 회수한다
  claim-timeout: 3m
  # 재시도 상한과 지수 백오프 기준 간격
  max-attempts: 3
  retry-base-delay: 30s

listing:
  # 마켓 전송 재시도 상한과 지수 백오프 기준 간격
  max-attempts: 3
  retry-base-delay: 60s
  # 디스패처가 한 번에 집어가는 건수
  batch-size: 5
  # 이 시간 안에 마켓 응답이 없으면 전송이 끊긴 것으로 보고 회수한다
  send-timeout: 2m
  # 판매가 계산 근거 (원가 x 환율 x (1 + 마진율), 100원 단위 올림)
  exchange-rate: 195.0
  margin-rate: 0.30
  round-to: 100

logging:
  level:
    io.github.jaehyeoksim.sourcing: DEBUG

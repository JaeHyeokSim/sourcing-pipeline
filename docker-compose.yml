# PostgreSQL 로 돌려보기 위한 로컬 DB.
#   docker compose up -d
#   ./gradlew bootRun --args='--spring.profiles.active=postgres'
services:
  postgres:
    image: postgres:17-alpine
    container_name: sourcing-postgres
    environment:
      POSTGRES_DB: sourcing
      POSTGRES_USER: sourcing
      POSTGRES_PASSWORD: sourcing
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcing -d sourcing"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
